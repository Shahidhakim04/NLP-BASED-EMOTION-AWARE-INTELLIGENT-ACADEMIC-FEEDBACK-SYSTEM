<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion-Aware Intelligent Academic Feedback</title>

    <!-- Google Font: Outfit for modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Phosphor Icons for modern icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --secondary: #ec4899;
            --bg-dark: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Dynamic Animated Background */
        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background:
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(59, 130, 246, 0.15) 0%, transparent 50%);
            filter: blur(60px);
            animation: breathe 10s ease-in-out infinite alternate;
        }

        @keyframes breathe {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            100% {
                transform: scale(1.1);
                opacity: 1;
            }
        }

        /* Glassmorphism Container */
        .glass-container {
            width: 100%;
            max-width: 800px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(40px);
            z-index: 10;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header Section */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc 0%, #fbcfe8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 400;
        }

        /* Form Elements */
        .form-group {
            position: relative;
            margin-bottom: 2rem;
        }

        .textarea-wrapper {
            position: relative;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .textarea-wrapper:focus-within {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            transform: translateY(-2px);
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 1.5rem;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.05rem;
            resize: none;
            line-height: 1.6;
        }

        textarea:focus {
            outline: none;
        }

        textarea::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }

        .stats-counter {
            display: flex;
            justify-content: flex-end;
            gap: 1.5rem;
            margin-top: 0.8rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        
        .badge-enhanced {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.6rem;
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            background: rgba(236, 72, 153, 0.1);
            border: 1px solid rgba(236, 72, 153, 0.3);
            color: #fbcfe8;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Button Styling */
        .btn-submit {
            width: 100%;
            padding: 1.2rem;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, transparent 100%);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .btn-submit:hover::before {
            transform: translateX(100%);
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Loading State */
        .loading-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(5px);
            border-radius: 24px;
            z-index: 20;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .loading-overlay.active {
            display: flex;
            opacity: 1;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--secondary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: var(--text-main);
            font-weight: 500;
            font-size: 1.1rem;
            animation: pulse-txt 1.5s infinite;
        }

        @keyframes pulse-txt {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* Results Section */
        .results-container {
            margin-top: 2.5rem;
            padding-top: 2.5rem;
            border-top: 1px solid var(--glass-border);
            animation: fadeIn 0.6s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .results-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .results-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .results-header i {
            font-size: 2rem;
            color: var(--success);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
            position: relative;
            overflow: hidden;
        }

        .metric-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .metric-icon {
            position: absolute;
            top: -10px;
            right: -10px;
            font-size: 5rem;
            opacity: 0.05;
            transform: rotate(-15deg);
        }

        .metric-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            display: inline-block;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            width: fit-content;
        }

        /* Specific Metric Colors */
        .metric-emotion .metric-value {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .metric-confidence .metric-value {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .metric-quality .metric-value {
            background: rgba(245, 158, 11, 0.2);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 1rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success), #34d399);
            border-radius: 10px;
            width: 0;
            transition: width 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .feedback-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem;
            position: relative;
        }

        .feedback-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, var(--primary), var(--secondary));
            border-top-left-radius: 16px;
            border-bottom-left-radius: 16px;
        }

        .feedback-box h3 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .feedback-box p {
            color: #cbd5e1;
            line-height: 1.8;
            font-size: 1.05rem;
            text-align: justify;
        }

        /* Animation utilities */
        .delay-1 {
            animation-delay: 0.1s;
        }

        .delay-2 {
            animation-delay: 0.2s;
        }

        .delay-3 {
            animation-delay: 0.3s;
        }

        @media (max-width: 640px) {
            .glass-container {
                padding: 2rem;
            }

            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>

    <div class="bg-mesh"></div>

    <div class="glass-container">

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <div class="loading-text">Analyzing your response...</div>
        </div>

        <div class="header" style="position: relative;">
            <a href="/progress" style="position: absolute; top: -1.5rem; right: 0; display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; padding: 0.5rem 1rem; border-radius: 10px; background: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--glass-border); font-weight: 500; font-size: 0.85rem; transition: all 0.3s;" onmouseover="this.style.background='rgba(255, 255, 255, 0.1)'; this.style.transform='translateY(-2px)';" onmouseout="this.style.background='rgba(255, 255, 255, 0.05)'; this.style.transform='translateY(0)';">
                <i class="ph-bold ph-chart-line-up"></i> My Progress
            </a>
            <h1>AI Intelligence Engine</h1>
            <p>Multi-dimensional analysis for your academic responses</p>
            <div class="badge-enhanced"><i class="ph-bold ph-magic-wand"></i> ENHANCED EDITION</div>
        </div>

        <form method="POST" action="/" id="feedbackForm">
            <div class="form-group">
                <div class="textarea-wrapper">
                    <textarea name="answer" id="answerText"
                        placeholder="Type your academic response here... Dive deep into your knowledge and let our AI analyze your structural quality and emotional undertones!" required
                        oninput="updateCharCount()">{% if request.form.answer %}{{ request.form.answer }}{% endif %}</textarea>
                </div>
                <div class="stats-counter">
                    <span>Aa <span id="wordCount">0</span> words</span>
                    <span>T <span id="charCount">0</span> chars</span>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="ph-bold ph-magic-wand"></i> Run Deep Analysis
            </button>
        </form>


    </div>

    <script>
        // Init character count
        function updateCharCount() {
            const textarea = document.getElementById('answerText');
            const text = textarea.value;
            
            document.getElementById('charCount').textContent = text.length;
            
            const words = text.trim() ? text.trim().split(/\s+/) : [];
            document.getElementById('wordCount').textContent = words.length;
        }

        // Run once on load to handle pre-filled text
        updateCharCount();

        // Handle form submit visually
        document.getElementById('feedbackForm').addEventListener('submit', function () {
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.classList.add('active');
        });

    </script>
</body>

</html>
